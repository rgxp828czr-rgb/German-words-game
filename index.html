<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>German Words Game – Lektion 10</title>
<style>
  body { font-family: system-ui, -apple-system, Arial, sans-serif; background:#0f172a; color:#e5e7eb; margin:0; }
  header { padding:16px; text-align:center; background:#020617; }
  h1 { margin:0; font-size:1.2rem; }
  .container { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  button { background:#2563eb; color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; }
  button.secondary { background:#334155; }
  button.ghost { background:transparent; border:1px dashed #334155; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .word { font-size:1.6rem; margin:12px 0; }
  .muted { color:#94a3b8; }
  input { width:100%; padding:10px; border-radius:10px; border:1px solid #334155; background:#020617; color:#e5e7eb; }
  .list { columns:2; column-gap:16px; }
  @media (max-width:600px){ .list{columns:1;} }
  .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#020617; border:1px solid #334155; margin:4px; }
</style>
</head>
<body>
<header>
  <h1>German Words Game — Lektion 10</h1>
  <div class="muted">Flashcards • Typing • Quick Quiz</div>
</header>

<div class="container">
  <div class="card">
    <div class="row">
      <button onclick="mode='flash';render()">Flashcards</button>
      <button onclick="mode='type';render()">Typing</button>
      <button onclick="mode='quiz';render()">Quiz</button>
      <button class="secondary" onclick="shuffle()">Shuffle</button>
    </div>
  </div>

  <div id="app" class="card"></div>

  <div class="card">
    <h3>All words (Lektion 10)</h3>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const words = [
  ["der Flughafen, -¨e","aeroport"],
  ["chatten","chat qilmoq"],
  ["der Kollege, -n","hamkasb (erkak)"],
  ["die Kollegin, -nen","hamkasb (ayol)"],
  ["der Flug, -¨e","parvoz"],
  ["der Abendflug, -¨e","kechki reys"],
  ["die Reise, -n","sayohat"],
  ["kurz","qisqa"],
  ["abfliegen","uchib ketmoq"],
  ["starten","start olmoq, uchmoq"],
  ["ankommen","yetib kelmoq"],
  ["dort","u yerda"],
  ["so","shunday, taxminan"],
  ["anrufen","qo‘ng‘iroq qilmoq"],
  ["noch mal","yana bir marta"],
  ["früh","erta"],
  ["sicher","ishonchli, albatta"],
  ["die Stimme, -n","ovoz"],
  ["versuchen","urinmoq, harakat qilmoq"],
  ["hoffentlich","umid qilamanki"],
  ["die Verspätung, -en","kechikish"],
  ["kaputt","buzilgan"],
  ["die Maschine, -n","samolyot, mashina"],
  ["landen","qo‘nmoq (samolyot)"],
  ["alles","hammasi"],
  ["klar","tushunarli"],
  ["lieber","yaxshiroq, afzal"],
  ["wenig","oz"],
  ["der Akku, -s","batareya, quvvat"],
  ["verstehen","tushunmoq"],
  ["abholen","olib ketmoq"],
  ["natürlich","albatta"],
  ["freuen (sich)","xursand bo‘lmoq"],
  ["Bis gleich!","hozir ko‘rishamiz"],
  ["einsteigen","transportga chiqmoq"],
  ["umsteigen","transport almashtirmoq"],
  ["aussteigen","transportdan tushmoq"],
  ["der Verkehr (Sg.)","yo‘l harakati"],
  ["das Verkehrsmittel, -","transport vositasi"],
  ["das Gepäck (Sg.)","yuk"],
  ["der Bahnhof, -¨e","vokzal"],
  ["die U-Bahn, -en","metro (yerosti)"],
  ["das Taxi, -s","taksi"],
  ["der Bus, -se","avtobus"],
  ["der Zug, -¨e","poyezd"],
  ["die Straßenbahn, -en","tramvay"],
  ["die S-Bahn, -en","shahar elektr poyezdi"],
  ["das Flugzeug, -e","samolyot"],
  ["der Koffer, -","chamadon"],
  ["der Rucksack, -¨e","ryukzak"],
  ["einkaufen","xarid qilmoq"],
  ["abfahren","jo‘nab ketmoq"],
  ["fernsehen","televizor tomosha qilmoq"],
  ["die Durchsage, -n","e’lon (stansiyada)"],
  ["der Intercity, -s","shaharlararo poyezd"],
  ["der Bahnsteig, -e","platforma"],
  ["die Richtung, -en","yo‘nalish"],
  ["einfahren","kirib kelmoq (poyezd)"],
  ["das Gleis, -e","rels, yo‘l (poyezd uchun)"],
  ["die Fahrt, -en","safar"],
  ["enden","tugamoq"],
  ["beginnen","boshlanmoq"],
  ["stehen","turmoq"],
  ["der Ausgang, -¨e","chiqish"],
  ["nächst-","keyingi"],
  ["der Halt, -e","to‘xtash joyi"],
  ["der Hauptbahnhof, -¨e","markaziy vokzal"],
  ["die Vorsicht (Sg.)","ehtiyotlik"],
  ["Achtung!","diqqat!"]
];

let i=0, mode='flash';

function shuffle(){
  for(let j=words.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [words[j],words[k]]=[words[k],words[j]];
  }
  i=0; render();
}

function render(){
  const app=document.getElementById('app');
  if(mode==='flash'){
    const [de,uz]=words[i];
    app.innerHTML = `
      <div class="muted">Flashcard ${i+1}/${words.length}</div>
      <div class="word">${de}</div>
      <div class="muted">${uz}</div>
      <div class="row">
        <button onclick="i=(i-1+words.length)%words.length;render()">Prev</button>
        <button onclick="i=(i+1)%words.length;render()">Next</button>
      </div>`;
  } else if(mode==='type'){
    const [de,uz]=words[i];
    app.innerHTML = `
      <div class="muted">Type the Uzbek meaning</div>
      <div class="word">${de}</div>
      <input id="ans" placeholder="Type here..." />
      <div class="row">
        <button onclick="check('${uz.replace(/'/g,"\'")}')">Check</button>
        <button class="secondary" onclick="i=(i+1)%words.length;render()">Skip</button>
      </div>
      <div id="fb" class="muted"></div>`;
  } else {
    const [de,uz]=words[i];
    const opts=[uz];
    while(opts.length<4){
      const r=words[Math.floor(Math.random()*words.length)][1];
      if(!opts.includes(r)) opts.push(r);
    }
    opts.sort(()=>Math.random()-0.5);
    app.innerHTML = `
      <div class="muted">Quiz</div>
      <div class="word">${de}</div>
      <div class="row">
        ${opts.map(o=>`<button class="ghost" onclick="pick('${o.replace(/'/g,"\'")}','${uz.replace(/'/g,"\'")}')">${o}</button>`).join('')}
      </div>
      <div id="fb" class="muted"></div>`;
  }
}

function check(correct){
  const v=document.getElementById('ans').value.trim().toLowerCase();
  document.getElementById('fb').textContent = v===correct.toLowerCase() ? '✅ Correct' : '❌ Correct: '+correct;
}

function pick(v,correct){
  document.getElementById('fb').textContent = v===correct ? '✅ Correct' : '❌ Correct: '+correct;
}

function renderList(){
  const l=document.getElementById('list');
  l.innerHTML = words.map(w=>`<span class="pill">${w[0]} — ${w[1]}</span>`).join('');
}

render(); renderList();
</script>
</body>
</html>
